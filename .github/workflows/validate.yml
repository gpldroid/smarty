name: Validate Smarty

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/supabase.js
          node --check assets/js/m3u.js
          node --check assets/js/player.js
          node --check assets/js/storage.js
          node --check assets/js/cloud/snapshot.js
          node --check assets/js/services/iptv-org-client.js
          node --check assets/js/services/playlist-library.js
      - name: Run parser tests
        run: npm test